name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dev deps (eslint/prettier)
        run: npm install --no-audit --no-fund
      - name: Lint (non-blocking while baseline cleans up)
        continue-on-error: true
        run: npm run lint
      - name: Unit tests (node:test, zero-dep)
        run: npm test
      - name: Assets sync dry-run (ensure script works)
        run: npm run sync:assets
