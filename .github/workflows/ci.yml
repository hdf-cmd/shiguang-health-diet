name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dev deps (eslint/prettier)
        run: npm install --no-audit --no-fund
      - name: Version consistency (package.json ↔ js/version.js)
        run: npm run check:version
      - name: Lint
        run: npm run lint
      - name: Unit tests (node:test, zero-dep)
        run: npm test
      - name: Assets sync dry-run (ensure script works)
        run: npm run sync:assets
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ShiguangFlutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'   # 与 Task 1 本机 flutter --version 实装版本一致（账本 Ruling 2）
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
