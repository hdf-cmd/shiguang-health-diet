name: shiguang_flutter
description: "食光——健康饮食与体重管理 Flutter 客户端（2.0 重写线）。"
publish_to: 'none'

version: 2.16.1+23113

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  riverpod: ^3.4.3
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.5
  flutter_blue_plus: ^2.3.13
  permission_handler: 12.0.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  image_picker: ^1.2.3
  cached_network_image: ^4.0.4
  flutter_tts: ^4.2.5
  # M16：商品条码扫描（EAN-8/13、UPC-A、GTIN-14）。相机权限见 AndroidManifest。
  mobile_scanner: ^7.4.1
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ai_avatar.png
